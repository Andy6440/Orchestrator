name: Symfony CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo_mysql, intl
          coverage: xdebug

      - name: Set environment variables
        run: echo "DATABASE_URL=mysql://test_user:test_password@127.0.0.1:3306/test_database" > .env.test

      - name: Load environment variables
        run: cat .env.test >> $GITHUB_ENV

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Wait for MySQL to be ready
        run: |
          echo "⏳ Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" --silent; then
              echo "✅ MySQL is up!"
              break
            fi
            echo "⚠️ Waiting for MySQL..."
            sleep 2
          done

      - name: Prepare Database
        env:
          APP_ENV: test
        run: |
          echo "📌 Running migrations..."
          php bin/console doctrine:migrations:migrate --no-interaction --env=test || { echo "❌ Migration failed"; exit 1; }

          echo "📌 Loading fixtures..."
          php bin/console doctrine:fixtures:load --no-interaction --env=test || { echo "❌ Fixtures failed"; exit 1; }

          echo "✅ Database is ready!"
          sleep 3

      - name: Debug Database Schema After Setup
        run: |
          echo "🔍 Verifying if tables exist..."
          php bin/console doctrine:query:sql "SHOW TABLES" --env=test || { echo "❌ No tables found!"; exit 1; }
          sleep 2

      - name: Run tests
        env:
          APP_ENV: test
        run: php bin/phpunit --coverage-text --colors=never