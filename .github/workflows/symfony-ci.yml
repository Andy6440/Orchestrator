name: Symfony CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo_sqlite, intl
          coverage: xdebug

      - name: Set environment variables
        run: echo "DATABASE_URL=sqlite:///%kernel.project_dir%/var/data_test.db" > .env.test

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Database
        env:
          APP_ENV: test
        run: |
          echo "⚙️ Running migrations..."
          php bin/console doctrine:migrations:migrate --no-interaction --env=test || { echo "❌ Migration failed"; exit 1; }

          echo "📌 Loading fixtures..."
          php bin/console doctrine:fixtures:load --no-interaction --env=test || { echo "❌ Fixtures failed"; exit 1; }

          echo "✅ Database is ready!"

      - name: Debug Database Schema After Setup
        run: |
          echo "🔍 Verifying if tables exist..."
          php bin/console doctrine:query:sql "SELECT name FROM sqlite_master WHERE type='table';" --env=test || { echo "❌ No tables found!"; exit 1; }

      - name: Run tests
        env:
          APP_ENV: test
        run: php bin/phpunit --coverage-text --colors=never
