name: Symfony CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: database_test
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo_mysql, intl
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" --silent; then
              echo "MySQL is up!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Prepare Database
        run: |
          echo "⚙️ Resetting database..."
          mysql -h 127.0.0.1 -u user -ppassword -e "DROP DATABASE IF EXISTS database_test;"
          mysql -h 127.0.0.1 -u user -ppassword -e "CREATE DATABASE database_test;"

          echo "📌 Creating database if not exists..."
          php bin/console doctrine:database:create --if-not-exists
          
          echo "🚀 Running migrations..."
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration || { echo "❌ Migration failed"; exit 1; }
          
          echo "📌 Updating schema..."
          php bin/console doctrine:schema:update --force || { echo "❌ Schema update failed"; exit 1; }
          
          echo "📌 Loading fixtures..."
          php bin/console doctrine:fixtures:load --no-interaction || { echo "❌ Fixtures failed"; exit 1; }

          echo "✅ Database is ready!"
          sleep 5  # 🔹 Esperamos 5 segundos para asegurarnos de que MySQL termine todos los procesos.

      - name: Debug Database Schema After Setup
        run: |
          echo "🔍 Verifying if tables exist..."
          php bin/console doctrine:query:sql "SHOW TABLES" || { echo "❌ No tables found!"; exit 1; }
          sleep 2  # 🔹 Espera 2 segundos antes de los tests.

      - name: Run tests
        env:
          APP_ENV: test
        run: php bin/phpunit --configuration phpunit.dist.xml --coverage-text --colors=never
