name: Symfony CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ vars.DATABASEPASSWORD }}
          MYSQL_DATABASE: database
          MYSQL_USER: ${{ vars.DATABASEUSER }}
          MYSQL_PASSWORD: ${{ vars.DATABASEPASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --protocol=tcp --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo_mysql, intl
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=mysql://${{ vars.DATABASEUSER }}:${{ vars.DATABASEPASSWORD }}@127.0.0.1:3306/database?serverVersion=8.0.31" > .env.test
          echo "APP_ENV=test" >> .env.test
          cat .env.test >> $GITHUB_ENV

      - name: Wait for MySQL to be ready
        run: |
          echo "⏳ Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h "127.0.0.1" --protocol=tcp --silent --user=root --password=${{ vars.DATABASEPASSWORD }}; then
              echo "✅ MySQL is up!"
              break
            fi
            echo "⚠️ Waiting for MySQL..."
            sleep 2
          done

      - name: Verify MySQL connection
        run: |
          echo "🔍 Checking databases..."
          mysql -h 127.0.0.1 -u root -p${{ vars.DATABASEPASSWORD }} -e "SHOW DATABASES;"

      - name: Create test database and grant permissions
        run: |
          mysql -h 127.0.0.1 -u root -p${{ vars.DATABASEPASSWORD }} -e "CREATE DATABASE IF NOT EXISTS database;"
          mysql -h 127.0.0.1 -u root -p${{ vars.DATABASEPASSWORD }} -e "CREATE DATABASE IF NOT EXISTS database_test;"
          mysql -h 127.0.0.1 -u root -p${{ vars.DATABASEPASSWORD }} -e "GRANT ALL PRIVILEGES ON database.* TO '${{ vars.DATABASEUSER }}'@'%';"
          mysql -h 127.0.0.1 -u root -p${{ vars.DATABASEPASSWORD }} -e "GRANT ALL PRIVILEGES ON database_test.* TO '${{ vars.DATABASEUSER }}'@'%';"
          mysql -h 127.0.0.1 -u root -p${{ vars.DATABASEPASSWORD }} -e "FLUSH PRIVILEGES;"

      - name: Run database migrations
        env:
          APP_ENV: test
        run: |
          echo "🛠 Running database migrations..."
          php bin/console doctrine:migrations:migrate --no-interaction
          APP_ENV=test php bin/console doctrine:migrations:migrate --no-interaction

      - name: Load fixtures
        env:
          APP_ENV: test
        run: |
          echo "🛠 Loading fixtures..."
          php bin/console doctrine:fixtures:load --no-interaction

      - name: Run tests
        env:
          APP_ENV: test
        run: |
          echo "🛠 Running tests..."
          php bin/phpunit --coverage-text --colors=never

      - name: Check test results
        if: failure()
        run: |
          echo "❌ Tests failed! Cannot merge this PR until tests pass."
          exit 1
