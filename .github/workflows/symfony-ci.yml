name: Symfony CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ vars.DATABASEPASSWORD }}
          MYSQL_DATABASE: ${{ vars.DATABASENAME }}
          MYSQL_USER: ${{ vars.DATABASEUSER }}
          MYSQL_PASSWORD: ${{ vars.DATABASEPASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --protocol=tcp --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: mbstring, pdo_mysql, intl
          coverage: xdebug

      - name: Set environment variables
        run: echo "DATABASE_URL=mysql://${{ vars.DATABASEUSER }}:${{ vars.DATABASEPASSWORD }}@${{ vars.DATABASEHOST }}:${{ vars.DATABASEPORT }}/${{ vars.DATABASENAME }}" > .env.test

      - name: Load environment variables
        run: cat .env.test >> $GITHUB_ENV

      - name: Wait for MySQL to be ready
        run: |
          echo "⏳ Waiting for MySQL to be ready..."
          for i in {1..30}; do
            if mysqladmin ping -h "127.0.0.1" --protocol=tcp --silent --user=root --password=${{ vars.DATABASEPASSWORD }}; then
              echo "✅ MySQL is up!"
              break
            fi
            echo "⚠️ Waiting for MySQL..."
            sleep 2
          done

      - name: Create test database and grant permissions
        run: |
          mysql -h 127.0.0.1 -u user -p password -e "CREATE DATABASE IF NOT EXISTS ${{ vars.DATABASENAME }};"
          mysql -h 127.0.0.1 -u user -p password -e "CREATE USER IF NOT EXISTS '${{ vars.DATABASEUSER }}'@'%' IDENTIFIED BY '${{ vars.DATABASEPASSWORD }}';"
          mysql -h 127.0.0.1 -u user -p password -e "GRANT ALL PRIVILEGES ON ${{ vars.DATABASENAME }}.* TO '${{ vars.DATABASEUSER }}'@'%';"
          mysql -h 127.0.0.1 -u user -p password -e "FLUSH PRIVILEGES;"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run migrations and tests
        env:
          APP_ENV: test
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:fixtures:load --no-interaction 
          php bin/phpunit --coverage-text --colors=never